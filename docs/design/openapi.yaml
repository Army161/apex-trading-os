# Written by `npm run openapi` from packages/sdk/src/contract.ts. Do not edit by hand: change the contract and run it again.
openapi: "3.1.0"
info:
  title: "Apex API"
  version: "1.0.0"
  description: "Read the Apex ledger and queue a claim check. No route creates, changes or cancels an order, approves anything, resumes anything or changes a limit. Every performance figure is a Metric with its sample size and basis."
servers:
  - url: "/api/v1"
paths:
  "/status":
    get:
      operationId: status
      summary: "Mode, halts, counts of tries and slots, data status and the last run."
      security:
        - apiKey:
            - "read:status"
      x-apex-rate: "120 every 60 seconds for each key"
      parameters: []
      responses:
        "200":
          description: OK
          headers:
            x-apex-mode:
              "$ref": "#/components/headers/x-apex-mode"
            x-apex-trials:
              "$ref": "#/components/headers/x-apex-trials"
            ETag:
              "$ref": "#/components/headers/ETag"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Status"
        "304":
          "$ref": "#/components/responses/NotModified"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/ForbiddenScope"
        "422":
          "$ref": "#/components/responses/Invalid"
        "429":
          "$ref": "#/components/responses/RateLimited"
        "503":
          "$ref": "#/components/responses/Unavailable"
