  "/claim-checks":
    get:
      operationId: claimChecks
      summary: "Claim checks, newest first."
      security:
        - apiKey:
            - "queue:claims"
      x-apex-rate: "120 every 60 seconds for each key"
      parameters:
        - name: limit
          in: query
          required: false
          description: "Rows a page."
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          required: false
          description: "The `next` value of the page before."
          schema:
            type: string
      responses:
        "200":
          description: OK
          headers:
            x-apex-mode:
              "$ref": "#/components/headers/x-apex-mode"
            x-apex-trials:
              "$ref": "#/components/headers/x-apex-trials"
            ETag:
              "$ref": "#/components/headers/ETag"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ClaimCheckRowPage"
        "304":
          "$ref": "#/components/responses/NotModified"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/ForbiddenScope"
        "422":
          "$ref": "#/components/responses/Invalid"
        "429":
          "$ref": "#/components/responses/RateLimited"
        "503":
          "$ref": "#/components/responses/Unavailable"
    post:
      operationId: claimCheckStart
      summary: "Run a claim check. It uses tries from the weekly budget. Refused while anything is halted."
      security:
        - apiKey:
            - "queue:claims"
      x-apex-rate: "10 every 3600 seconds for each key"
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ClaimCheckBody"
      responses:
        "202":
          description: OK
          headers:
            x-apex-mode:
              "$ref": "#/components/headers/x-apex-mode"
            x-apex-trials:
              "$ref": "#/components/headers/x-apex-trials"
            ETag:
              "$ref": "#/components/headers/ETag"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ClaimCheckAccepted"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/ForbiddenScope"
        "409":
