        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/ForbiddenScope"
        "404":
          "$ref": "#/components/responses/NotFound"
        "422":
          "$ref": "#/components/responses/Invalid"
        "429":
          "$ref": "#/components/responses/RateLimited"
        "503":
          "$ref": "#/components/responses/Unavailable"
  "/halt":
    post:
      operationId: halt
      summary: "Pull the andon cord. Safe to repeat. There is no route that releases it."
      security:
        - apiKey:
            - halt
      x-apex-rate: "5 every 3600 seconds for each key"
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/HaltBody"
      responses:
        "200":
          description: OK
          headers:
            x-apex-mode:
              "$ref": "#/components/headers/x-apex-mode"
            x-apex-trials:
              "$ref": "#/components/headers/x-apex-trials"
            ETag:
              "$ref": "#/components/headers/ETag"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/HaltResult"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/ForbiddenScope"
        "409":
          "$ref": "#/components/responses/Conflict"
        "422":
          "$ref": "#/components/responses/Invalid"
        "429":
          "$ref": "#/components/responses/RateLimited"
        "503":
          "$ref": "#/components/responses/Unavailable"
components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: "A key made in the dashboard under You, Setup: `apx_<id>_<secret>`. Scopes: read:status, read:board, read:slots, read:book, read:ledger, read:reports, read:data, read:agents, queue:claims, queue:research, halt. There is no scope for approve, resume, limits or live."
  headers:
    x-apex-mode:
      description: "`paper`, or `live` only when the ledger holds a slot in a live stage."
      schema:
        type: string
    x-apex-trials:
      description: "Tries counted so far. Absent when no ledger is connected."
      schema:
        type: integer
    ETag:
      description: "Send it back in `If-None-Match` to get `304`."
      schema:
        type: string
  responses:
    NotModified:
      description: "Not changed since the `ETag` you sent."
    Unauthorized:
      description: "No key, an unknown key or a revoked key."
      content:
        "application/problem+json":
          schema:
            "$ref": "#/components/schemas/Problem"
    ForbiddenScope:
      description: "The key does not hold the scope this route needs."
      content:
        "application/problem+json":
          schema:
            "$ref": "#/components/schemas/Problem"
    NotFound:
      description: "Nothing with that id."
      content:
        "application/problem+json":
          schema:
            "$ref": "#/components/schemas/Problem"
    Conflict:
      description: "Halted, out of budget or a run is in progress."
      content:
        "application/problem+json":
          schema:
            "$ref": "#/components/schemas/Problem"
    Invalid:
      description: "The body or a query value is not valid."
      content:
        "application/problem+json":
          schema:
            "$ref": "#/components/schemas/Problem"
    RateLimited:
      description: "Too many calls. `Retry-After` says when to try again."
      content:
        "application/problem+json":
          schema:
            "$ref": "#/components/schemas/Problem"
    Unavailable:
      description: "No ledger is connected, or it could not be read."
      content:
        "application/problem+json":
          schema:
            "$ref": "#/components/schemas/Problem"
  schemas:
    Metric:
      type: object
      properties:
        value:
          type: number
        unit:
          type: string
          enum:
            - pct
            - usd
            - ratio
            - count
            - prob
        "n":
          type: integer
        basis:
          type: string
          enum:
            - in_sample
            - forward
            - book
        net:
          type: boolean
        receipt:
          type: integer
      required:
        - value
        - unit
        - "n"
        - basis
        - net
    Problem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          enum:
            - unauthorized
            - forbidden_scope
            - not_found
            - validation
            - rate_limited
            - halted
            - budget
            - busy
            - unavailable
      required:
        - type
        - title
        - status
        - code
    Receipt:
      type: object
      properties:
        seq:
          type: integer
        kind:
          type: string
        ts:
          type: string
          format: date-time
        actor:
          type: string
        payloadHash:
          type: string
        prevHash:
          type: string
        hash:
          type: string
      required:
        - seq
        - kind
        - ts
        - actor
        - payloadHash
        - prevHash
        - hash
    Check:
      type: object
      properties:
        "n":
          type: integer
        name:
          type: string
        pass:
          type: boolean
        why:
          type: string
        value:
          anyOf:
            - type: number
            - type: "null"
      required:
        - "n"
        - name
        - pass
        - why
        - value
    Evaluation:
      type: object
      properties:
        trialKey:
          type: string
        strategy:
          type: string
        symbol:
          type: string
        tf:
          type: string
        panel:
          type: string
        status:
          type: string
        slotKey:
          anyOf:
            - type: string
            - type: "null"
        checksPassed:
          type: integer
        checks:
          type: array
          items:
            "$ref": "#/components/schemas/Check"
        why:
          type: string
        source:
          type: string
        validated:
          type: boolean
        error:
          anyOf:
            - type: string
            - type: "null"
        nTrials:
          anyOf:
            - type: integer
            - type: "null"
        metrics:
          type: object
          properties:
            ret:
              "$ref": "#/components/schemas/Metric"
            sharpe:
              "$ref": "#/components/schemas/Metric"
            maxDrawdown:
              "$ref": "#/components/schemas/Metric"
            dsr:
              anyOf:
                - "$ref": "#/components/schemas/Metric"
                - type: "null"
          required:
            - ret
            - sharpe
            - maxDrawdown
            - dsr
        receipt:
          type: integer
      required:
        - trialKey
        - strategy
        - symbol
        - tf
        - panel
        - status
        - slotKey
        - checksPassed
        - checks
        - why
        - source
        - validated
        - error
        - nTrials
        - metrics
        - receipt
    ValidatorRun:
      type: object
      properties:
        seq:
          type: integer
        purpose:
          type: string
        level:
          type: string
        agrees:
          type: boolean
        exact:
          type: boolean
        source:
          type: string
        diffs:
          type: array
          items:
            type: string
      required:
        - seq
        - purpose
        - level
        - agrees
        - exact
        - source
        - diffs
    EvaluationDetail:
      allOf:
        - "$ref": "#/components/schemas/Evaluation"
        - type: object
          properties:
            hypothesis:
              type: string
            passBar:
              type: string
            preregSeq:
              anyOf:
                - type: integer
                - type: "null"
            validator:
              type: array
              items:
                "$ref": "#/components/schemas/ValidatorRun"
            receiptEntry:
              anyOf:
                - "$ref": "#/components/schemas/Receipt"
                - type: "null"
            benchmark:
              anyOf:
                - type: object
                  properties:
                    bars:
                      type: integer
                    ret:
                      "$ref": "#/components/schemas/Metric"
                    sharpe:
                      "$ref": "#/components/schemas/Metric"
                    maxDrawdown:
                      "$ref": "#/components/schemas/Metric"
                  required:
                    - bars
                    - ret
                    - sharpe
                    - maxDrawdown
                - type: "null"
            tStat:
              anyOf:
                - type: number
                - type: "null"
            inputs:
              anyOf:
                - type: object
                  properties:
                    strategyFingerprint:
                      type: string
                    datasets:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: string
                          version:
                            type: string
                        required:
                          - id
                          - version
                    gateVersion:
                      type: string
                    costModelVersion:
                      type: string
                    engineFingerprint:
                      type: string
                    seed:
                      anyOf:
                        - type: number
                        - type: "null"
                  required:
                    - strategyFingerprint
                    - datasets
                    - gateVersion
                    - costModelVersion
                    - engineFingerprint
                    - seed
                - type: "null"
            data:
              anyOf:
                - type: object
                  properties:
                    first:
                      type: string
                      format: date-time
                    last:
                      type: string
                      format: date-time
                    rows:
                      type: integer
                  required:
                    - first
                    - last
                    - rows
                - type: "null"
          required:
            - hypothesis
            - passBar
            - preregSeq
            - validator
            - receiptEntry
            - benchmark
            - tStat
            - inputs
            - data
    Slot:
      type: object
      properties:
        slotKey:
          type: string
        trialKey:
          type: string
        strategy:
          type: string
        symbol:
          type: string
        tf:
          type: string
        status:
          type: string
        role:
          type: string
        shadowOf:
          anyOf:
            - type: string
            - type: "null"
        weight:
          type: number
        riskFraction:
          type: number
        lockedAt:
          type: string
          format: date-time
        lockSeq:
          type: integer
        forwardTrades:
          type: integer
        drift:
          type: object
          properties:
            cusum:
              type: number
            pauses:
              type: integer
          required:
            - cusum
            - pauses
        graduation:
          type: object
          properties:
            state:
              anyOf:
                - type: string
                - type: "null"
            month:
              anyOf:
                - type: string
                - type: "null"
          required:
            - state
            - month
      required:
        - slotKey
        - trialKey
        - strategy
        - symbol
        - tf
        - status
        - role
        - shadowOf
        - weight
        - riskFraction
        - lockedAt
        - lockSeq
        - forwardTrades
        - drift
        - graduation
    Lock:
      type: object
      properties:
        id:
          type: string
          enum:
            - evidence
            - validated
            - approved
            - machine
        open:
          type: boolean
        why:
          type: string
      required:
        - id
        - open
        - why
    Locks:
      type: object
      properties:
        slotKey:
          type: string
        allowed:
          type: boolean
        locks:
          type: array
          items:
            "$ref": "#/components/schemas/Lock"
      required:
        - slotKey
        - allowed
        - locks
    Position:
      type: object
      properties:
        slotKey:
          type: string
        symbol:
          type: string
        side:
          type: string
          enum:
            - long
            - short
        qty:
          type: number
        entry:
          type: number
        stop:
          type: number
        riskUsd:
          type: number
        riskPct:
          type: number
        since:
          type: string
          format: date-time
      required:
        - slotKey
        - symbol
        - side
        - qty
        - entry
        - stop
        - riskUsd
        - riskPct
        - since
    SlotDetail:
      allOf:
        - "$ref": "#/components/schemas/Slot"
        - type: object
          properties:
            fingerprint:
              type: string
            lock:
              anyOf:
                - "$ref": "#/components/schemas/Receipt"
                - type: "null"
            locks:
              type: array
              items:
