  "/claim-checks/{id}":
    get:
      operationId: claimCheck
      summary: "One claim check as the ledger holds it. The source text is never stored, so it is not here."
      security:
        - apiKey:
            - "queue:claims"
      x-apex-rate: "120 every 60 seconds for each key"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          headers:
            x-apex-mode:
              "$ref": "#/components/headers/x-apex-mode"
            x-apex-trials:
              "$ref": "#/components/headers/x-apex-trials"
            ETag:
              "$ref": "#/components/headers/ETag"
