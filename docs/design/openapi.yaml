            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          required: false
          description: "The `next` value of the page before."
          schema:
            type: string
        - name: status
          in: query
          required: false
          description: "One status."
          schema:
            type: string
        - name: market
          in: query
          required: false
          description: "One symbol."
          schema:
            type: string
        - name: tf
          in: query
          required: false
          description: "One timeframe."
          schema:
            type: string
        - name: q
