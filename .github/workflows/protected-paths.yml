# Red paths need Jeremy's approving review on the current commit (docs/design/02 section 9).
# This check is expected to be red on a pull request that touches a red path until he approves. That is the point of it.
name: protected-paths
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]
permissions:
  contents: read
  pull-requests: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, ref: '${{ github.event.pull_request.head.sha }}' }
      - name: the rules as they are on the base branch
        uses: actions/checkout@v4
        with: { ref: '${{ github.event.pull_request.base.sha }}', path: .base-rules }
      - name: red paths need the code owner's approval
        run: |
          CHECKER=tools/protected_paths.mjs
          if [ -f .base-rules/tools/protected_paths.mjs ]; then CHECKER=.base-rules/tools/protected_paths.mjs; echo "using the base branch copy of the checker"; fi
          node "$CHECKER" --pr
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RULES_ROOT: ${{ github.workspace }}/.base-rules
          REPO_ROOT: ${{ github.workspace }}
